[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "sshio"
version = "0.1.0"
requires-python = ">=3.10"
description = "Canonical sshio simulation for synthetic multi-agent learning"

[tool.maturin]
manifest-path = "crates/sshio-python/Cargo.toml"
python-source = "python"
module-name = "sshio._native"
